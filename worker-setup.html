<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriHire</title><link rel="icon" href="assets/mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="worker-setup"><div class="app"><header><a href="javascript:history.back()" aria-label="Back">←</a><h1><span data-en="My worker profile" data-hi="मेरी मज़दूर प्रोफ़ाइल">My worker profile</span></h1><button class="lang" id="lg" type="button" aria-label="Language">अ/A</button></header><main><div class="alert warn"><span data-en="Farmers can see and book you only after you save this profile." data-hi="यह प्रोफ़ाइल सहेजने के बाद ही किसान आपको देख और बुक कर पाएँगे।">Farmers can see and book you only after you save this profile.</span></div><form class="form" data-next="worker-home.html" data-api="/workers/me" data-method="PUT" data-prefill="/workers/me"><div><label for="f20"><span data-en="Skill" data-hi="कौशल">Skill</span></label><select id="f20" data-k="skill" required><option>Harvesting</option><option>Sowing</option><option>Weeding</option><option>Loading</option><option>General farm work</option></select></div><div><label for="f21"><span data-en="Daily wage ₹" data-hi="दैनिक मज़दूरी ₹">Daily wage ₹</span></label><input id="f21" type="number" placeholder="400" data-k="rate" min="1" required></div><div><label for="f22"><span data-en="Village / Town" data-hi="गाँव / शहर">Village / Town</span></label><input id="f22" type="text" placeholder="Where you work" data-k="village" required></div><div><label for="f23"><span data-en="People in your team (1 = only me)" data-hi="टीम में लोग (1 = सिर्फ़ मैं)">People in your team (1 = only me)</span></label><input id="f23" type="number" placeholder="1" data-k="
