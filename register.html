<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriHire</title><link rel="icon" href="assets/mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="register"><div class="app"><header><a href="javascript:history.back()" aria-label="Back">←</a><h1><span data-en="Create account" data-hi="खाता बनाएँ">Create account</span></h1><button class="lang" id="lg" type="button" aria-label="Language">अ/A</button></header><main><form class="form" data-next="otp.html" data-api="/auth/register"><div><label for="f3"><span data-en="Full name" data-hi="पूरा नाम">Full name</span></label><input id="f3" type="text" placeholder="Your name" data-k="name" required></div><div><label for="f4"><span data-en="Mobile number" data-hi="मोबाइल नंबर">Mobile number</span></label><input id="f4" type="tel" placeholder="10-digit number" data-k="phone" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" required></div><div><label for="f5"><span data-en="Password" data-hi="पासवर्ड">Password</span></label><input id="f5" type="password" placeholder="min 6 characters" data-k="password" minlength="6" maxlength="72" required></div><div><label for="f6"><span data-en="Village / Town" data-hi="गाँव / शहर">Village / Town</span></label><input id="f6" type="text" placeholder="Your village or town" data-k="village" required></div><button class="btn" type="submit"><span data-en="Send SMS code" data-hi="SMS कोड भेजें">Send SMS code</span></button></form></main></div><noscript>Please turn on JavaScript.</noscript><script src="app.js"></script></body></html>
