<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriHire</title><link rel="icon" href="assets/mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="otp"><div class="app"><header><a href="javascript:history.back()" aria-label="Back">←</a><h1><span data-en="Confirm mobile number" data-hi="मोबाइल नंबर की पुष्टि">Confirm mobile number</span></h1><button class="lang" id="lg" type="button" aria-label="Language">अ/A</button></header><main><div class="alert warn"><span data-en="We sent a 6-digit code by SMS to" data-hi="6 अंकों का कोड SMS से भेजा गया:">We sent a 6-digit code by SMS to</span> <b data-bind="pendingPhone"></b></div><form class="form" data-next="role.html" data-api="/auth/verify" data-with-phone><div><label for="f7"><span data-en="SMS code" data-hi="SMS कोड">SMS code</span></label><input id="f7" type="tel" placeholder="6-digit code" data-k="code" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="off" required></div><button class="btn" type="submit"><span data-en="Confirm" data-hi="पुष्टि करें">Confirm</span></button></form><button class="btn ghost" id="resend" type="button" disabled><span data-en="Send the code again" data-hi="कोड दोबारा भेजें">Send the code again</span></button></main></div><noscript>Please turn on JavaScript.</noscript><script src="app.js"></script></body></html>
