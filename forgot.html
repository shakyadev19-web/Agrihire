<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriHire</title><link rel="icon" href="assets/mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="forgot"><div class="app"><header><a href="javascript:history.back()" aria-label="Back">←</a><h1><span data-en="Reset password" data-hi="पासवर्ड रीसेट">Reset password</span></h1><button class="lang" id="lg" type="button" aria-label="Language">अ/A</button></header><main><form class="form" id="forgot-1"><div><label for="fg1"><span data-en="Mobile number" data-hi="मोबाइल नंबर">Mobile number</span></label><input id="fg1" type="tel" placeholder="10-digit number" data-k="phone" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" required></div><button class="btn" type="submit"><span data-en="Send SMS code" data-hi="SMS कोड भेजें">Send SMS code</span></button></form><form class="form" id="forgot-2" hidden><div class="alert warn"><span data-en="Enter the code from the SMS and choose a new password." data-hi="SMS का कोड डालें और नया पासवर्ड चुनें।">Enter the code from the SMS and choose a new password.</span></div><div><label for="fg2"><span data-en="SMS code" data-hi="SMS कोड">SMS code</span></label><input id="fg2" type="tel" placeholder="6-digit code" data-k="code" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="off" required></div><div><label for="fg3"><span data-en="New password" data-hi="नया पासवर्ड">New password</span></label><input id="fg3" type="password" placeholder="min 6 characters" data-k="password" minlength="6" maxlength="72" required></div><button class="btn" type="submit"><span data-en="Save new password" data-hi="नया पासवर्ड सहेजें">Save new password</span></button></form></main></div><noscript>Please turn on JavaScript.</noscript><script src="app.js"></script></body></html>
