<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriHire</title><link rel="icon" href="assets/mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="index"><div class="app"><main><button class="lang lang-float" id="lg" type="button" aria-label="Language">अ/A</button><img class="logo" alt="AgriHire logo" src="assets/logo.png" style="max-width:220px;border-radius:24px"><h2><span data-en="Login" data-hi="लॉगिन">Login</span></h2><form class="form" data-next="role.html" data-api="/auth/login"><div><label for="f1"><span data-en="Mobile number" data-hi="मोबाइल नंबर">Mobile number</span></label><input id="f1" type="tel" placeholder="10-digit number" data-k="phone" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" required></div><div><label for="f2"><span data-en="Password" data-hi="पासवर्ड">Password</span></label><input id="f2" type="password" placeholder="••••••" data-k="password" minlength="6" maxlength="72" required></div><button class="btn" type="submit"><span data-en="Login" data-hi="लॉगिन">Login</span></button></form><a class="btn ghost" href="forgot.html"><span data-en="Forgot password?" data-hi="पासवर्ड भूल गए?">Forgot password?</span></a><a class="btn gold" href="register.html"><span data-en="Create new account" data-hi="नया खाता बनाएँ">Create new account</span></a></main></div><noscript>Please turn on JavaScript.</noscript><script src="app.js"></script></body></html>
